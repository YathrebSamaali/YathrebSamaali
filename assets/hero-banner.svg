<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 284" width="960" height="284" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Yathreb Samaali — Full-Stack &amp; AI Developer</title>
  <desc id="hero-desc">Editorial developer banner for Yathreb Samaali, Full-Stack and AI Developer building intelligent, scalable, and user-centered web applications.</desc>

  <defs>
    <clipPath id="banner-clip">
      <rect x="0" y="0" width="960" height="284" rx="14" />
    </clipPath>

    <pattern id="subtle-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#151F32" stroke-width="1" />
    </pattern>

    <linearGradient id="left-mask" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0.92" />
      <stop offset="60%" stop-color="#0B1120" stop-opacity="0.72" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.15" />
    </linearGradient>

    <radialGradient id="node-halo" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#55D6E8" stop-opacity="0.16" />
      <stop offset="60%" stop-color="#8FB8FF" stop-opacity="0.06" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="hairline-accent" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#55D6E8" stop-opacity="0.85" />
      <stop offset="55%" stop-color="#8FB8FF" stop-opacity="0.45" />
      <stop offset="100%" stop-color="#151F32" stop-opacity="0.2" />
    </linearGradient>
  </defs>

  <g clip-path="url(#banner-clip)">
    <!-- Deep Navy Canvas -->
    <rect x="0" y="0" width="960" height="284" fill="#0B1120" />

    <!-- Subtle Architectural Grid -->
    <rect x="0" y="0" width="960" height="284" fill="url(#subtle-grid)" />
    <rect x="0" y="0" width="960" height="284" fill="url(#left-mask)" />

    <!-- Soft Ambient Halo Behind Right Diagram -->
    <circle cx="775" cy="142" r="175" fill="url(#node-halo)" />

    <!-- Left Editorial Accent Bar -->
    <rect x="40" y="46" width="2.5" height="192" rx="1.25" fill="#55D6E8" />

    <!-- Left Typography Block -->
    <text x="58" y="59" fill="#55D6E8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500" letter-spacing="0.9">
      Full-Stack &amp; AI Developer · Tunisia
    </text>

    <text x="58" y="112" fill="#E8EDF5" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8">
      Yathreb Samaali
    </text>

    <text x="58" y="146" fill="#8FB8FF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="15.5" font-weight="500" letter-spacing="-0.15">
      Professional Master's Degree in Intelligent Web Applications
    </text>

    <text x="58" y="180" fill="#A1ADBF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      Building intelligent, scalable, and user-centered web applications
    </text>
    <text x="58" y="201" fill="#A1ADBF" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="14" font-weight="400">
      at the intersection of software engineering and applied AI.
    </text>

    <!-- Editorial Rule &amp; Core Focus Line -->
    <line x1="58" y1="222" x2="564" y2="222" stroke="url(#hairline-accent)" stroke-width="1" />

    <text x="58" y="244" fill="#A1ADBF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11.5" font-weight="500">
      <tspan fill="#E8EDF5">Web Architecture</tspan>
      <tspan fill="#55D6E8">  ·  </tspan>
      <tspan fill="#E8EDF5">Machine Learning</tspan>
      <tspan fill="#55D6E8">  ·  </tspan>
      <tspan fill="#E8EDF5">Semantic Search</tspan>
    </text>

    <!-- Right-Side Minimal AI &amp; Systems Architecture Visual -->
    <g transform="translate(618, 38)">
      <rect x="0" y="0" width="302" height="208" rx="12" fill="#151F32" fill-opacity="0.72" stroke="#8FB8FF" stroke-opacity="0.18" stroke-width="1" />

      <!-- Top Frame Line -->
      <circle cx="18" cy="18" r="2.5" fill="#8FB8FF" fill-opacity="0.45" />
      <circle cx="29" cy="18" r="2.5" fill="#8FB8FF" fill-opacity="0.28" />
      <circle cx="40" cy="18" r="2.5" fill="#55D6E8" fill-opacity="0.85" />
      <text x="284" y="21.5" text-anchor="end" fill="#A1ADBF" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10" letter-spacing="0.4">
        Architecture · Intelligence
      </text>
      <line x1="0" y1="34" x2="302" y2="34" stroke="#8FB8FF" stroke-opacity="0.12" stroke-width="1" />

      <!-- System Stack Layers (Left Column inside Card) -->
      <rect x="20" y="52" width="126" height="34" rx="7" fill="#0B1120" stroke="#8FB8FF" stroke-opacity="0.25" stroke-width="1" />
      <circle cx="34" cy="69" r="3" fill="#8FB8FF" />
      <text x="45" y="73" fill="#E8EDF5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">
        Interface
      </text>

      <rect x="20" y="100" width="126" height="34" rx="7" fill="#0B1120" stroke="#8FB8FF" stroke-opacity="0.32" stroke-width="1" />
      <circle cx="34" cy="117" r="3" fill="#8FB8FF" />
      <text x="45" y="121" fill="#E8EDF5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">
        API Layer
      </text>

      <rect x="20" y="148" width="126" height="34" rx="7" fill="#0B1120" stroke="#55D6E8" stroke-opacity="0.55" stroke-width="1" />
      <circle cx="34" cy="165" r="3" fill="#55D6E8" />
      <text x="45" y="169" fill="#E8EDF5" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">
        AI &amp; Vector
      </text>

      <!-- Vertical Layer Connections -->
      <line x1="83" y1="86" x2="83" y2="100" stroke="#8FB8FF" stroke-opacity="0.45" stroke-width="1.2" />
      <line x1="83" y1="134" x2="83" y2="148" stroke="#55D6E8" stroke-opacity="0.7" stroke-width="1.2" />

      <!-- Connector Paths to Semantic Embedding Graph -->
      <path d="M 146 117 C 168 117, 174 119, 192 119" fill="none" stroke="#8FB8FF" stroke-opacity="0.35" stroke-width="1.1" stroke-dasharray="3 3" />
      <path d="M 146 165 C 174 165, 180 138, 224 121" fill="none" stroke="#55D6E8" stroke-opacity="0.65" stroke-width="1.2" />

      <!-- Semantic Vector Space Orbit -->
      <circle cx="228" cy="119" r="50" fill="none" stroke="#8FB8FF" stroke-opacity="0.16" stroke-width="1" />
      <circle cx="228" cy="119" r="29" fill="none" stroke="#8FB8FF" stroke-opacity="0.22" stroke-width="1" stroke-dasharray="2.5 3" />
      <line x1="174" y1="119" x2="282" y2="119" stroke="#8FB8FF" stroke-opacity="0.12" stroke-width="1" />
      <line x1="228" y1="65" x2="228" y2="173" stroke="#8FB8FF" stroke-opacity="0.12" stroke-width="1" />

      <!-- Semantic Graph Edges -->
      <line x1="199" y1="94" x2="228" y2="119" stroke="#55D6E8" stroke-opacity="0.5" stroke-width="1" />
      <line x1="258" y1="90" x2="228" y2="119" stroke="#8FB8FF" stroke-opacity="0.55" stroke-width="1" />
      <line x1="261" y1="145" x2="228" y2="119" stroke="#55D6E8" stroke-opacity="0.45" stroke-width="1" />
      <line x1="201" y1="149" x2="228" y2="119" stroke="#8FB8FF" stroke-opacity="0.35" stroke-width="1" />
      <line x1="199" y1="94" x2="258" y2="90" stroke="#8FB8FF" stroke-opacity="0.2" stroke-width="0.9" />

      <!-- Semantic Nodes -->
      <circle cx="199" cy="94" r="3.5" fill="#0B1120" stroke="#55D6E8" stroke-width="1.5" />
      <circle cx="258" cy="90" r="4" fill="#8FB8FF" />
      <circle cx="261" cy="145" r="3.2" fill="#0B1120" stroke="#8FB8FF" stroke-width="1.5" />
      <circle cx="201" cy="149" r="3" fill="#0B1120" stroke="#A1ADBF" stroke-width="1.4" />
      <circle cx="228" cy="119" r="9" fill="#55D6E8" fill-opacity="0.18" />
      <circle cx="228" cy="119" r="4.8" fill="#55D6E8" />
    </g>
  </g>

  <!-- Crisp Outer Hairline -->
  <rect x="0.5" y="0.5" width="959" height="283" rx="13.5" fill="none" stroke="#151F32" stroke-width="1.2" />
</svg>
