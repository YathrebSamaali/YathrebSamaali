<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 270" width="960" height="270" role="img" aria-labelledby="hero-title hero-desc">
  <title id="hero-title">Yathreb Samaali — Full-Stack &amp; AI Developer</title>
  <desc id="hero-desc">Minimalist editorial developer banner for Yathreb Samaali, Full-Stack and AI Developer based in Tunisia, specializing in React, TypeScript, Spring Boot, Python, FastAPI, Machine Learning, and semantic search.</desc>

  <defs>
    <clipPath id="card-clip">
      <rect x="0" y="0" width="960" height="270" rx="14" />
    </clipPath>

    <pattern id="arch-grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M 32 0 L 0 0 0 32" fill="none" stroke="#1E293B" stroke-width="0.75" stroke-opacity="0.45" />
    </pattern>

    <radialGradient id="accent-glow" cx="78%" cy="50%" r="42%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.14" />
      <stop offset="55%" stop-color="#0284C7" stop-opacity="0.05" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0" />
    </radialGradient>

    <linearGradient id="grid-fade" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#0B1120" stop-opacity="0.95" />
      <stop offset="55%" stop-color="#0B1120" stop-opacity="0.78" />
      <stop offset="100%" stop-color="#0B1120" stop-opacity="0.2" />
    </linearGradient>

    <linearGradient id="accent-line" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#38BDF8" stop-opacity="0.9" />
      <stop offset="100%" stop-color="#38BDF8" stop-opacity="0.1" />
    </linearGradient>
  </defs>

  <g clip-path="url(#card-clip)">
    <!-- Base Obsidian Navy Canvas -->
    <rect x="0" y="0" width="960" height="270" fill="#0B1120" />

    <!-- Architectural Coordinate Grid -->
    <rect x="0" y="0" width="960" height="270" fill="url(#arch-grid)" />
    <rect x="0" y="0" width="960" height="270" fill="url(#grid-fade)" />

    <!-- Subtle Ambient Glow on Right Motif -->
    <rect x="0" y="0" width="960" height="270" fill="url(#accent-glow)" />

    <!-- Left Vertical Accent Rule -->
    <rect x="36" y="42" width="2.5" height="186" rx="1.25" fill="#38BDF8" fill-opacity="0.85" />

    <!-- Left Editorial Content -->
    <text x="54" y="53" fill="#38BDF8" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="600" letter-spacing="1.6">
      YATHREBSAMAALI  ·  TUNISIA
    </text>

    <text x="54" y="106" fill="#F8FAFC" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="38" font-weight="700" letter-spacing="-0.8">
      Yathreb Samaali
    </text>

    <text x="54" y="138" fill="#E2E8F0" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="18" font-weight="500" letter-spacing="-0.2">
      Full-Stack &amp; AI Developer
    </text>

    <text x="54" y="170" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      Designing scalable web architectures and intelligent applications
    </text>
    <text x="54" y="190" fill="#94A3B8" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif" font-size="13.5" font-weight="400">
      powered by Machine Learning, NLP, and semantic search.
    </text>

    <!-- Bottom Hairline & Metadata -->
    <line x1="54" y1="212" x2="576" y2="212" stroke="url(#accent-line)" stroke-width="1" />

    <text x="54" y="234" fill="#64748B" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="11" font-weight="500">
      <tspan fill="#94A3B8">M.Sc. Intelligent Web Applications</tspan>
      <tspan fill="#334155">  |  </tspan>
      <tspan fill="#38BDF8">React · Spring Boot · Python · FastAPI</tspan>
    </text>

    <!-- Right-Side Architectural System & Vector Space Motif -->
    <g transform="translate(625, 36)">
      <!-- Subtle Outer Frame -->
      <rect x="0" y="0" width="295" height="198" rx="10" fill="#0F172A" fill-opacity="0.72" stroke="#1E293B" stroke-width="1" />

      <!-- Header Bar inside Motif -->
      <circle cx="16" cy="16" r="2.5" fill="#334155" />
      <circle cx="26" cy="16" r="2.5" fill="#334155" />
      <circle cx="36" cy="16" r="2.5" fill="#38BDF8" fill-opacity="0.8" />
      <text x="279" y="19.5" text-anchor="end" fill="#475569" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="9.5" letter-spacing="0.8">
        SYSTEM · VECTOR
      </text>
      <line x1="0" y1="30" x2="295" y2="30" stroke="#1E293B" stroke-width="1" />

      <!-- Layer 1: Web Client -->
      <rect x="20" y="46" width="124" height="32" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
      <circle cx="33" cy="62" r="3" fill="#38BDF8" />
      <text x="44" y="66" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500">
        Web Client
      </text>

      <!-- Layer 2: Backend APIs -->
      <rect x="20" y="94" width="124" height="32" rx="6" fill="#111827" stroke="#334155" stroke-width="1" />
      <circle cx="33" cy="110" r="3" fill="#0EA5E9" />
      <text x="44" y="114" fill="#E2E8F0" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500">
        API Services
      </text>

      <!-- Layer 3: Data & Vector Store -->
      <rect x="20" y="142" width="124" height="32" rx="6" fill="#111827" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <circle cx="33" cy="158" r="3" fill="#38BDF8" />
      <text x="44" y="162" fill="#F8FAFC" font-family="ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace" font-size="10.5" font-weight="500">
        AI &amp; Search
      </text>

      <!-- Vertical Inter-Layer Links -->
      <line x1="82" y1="78" x2="82" y2="94" stroke="#475569" stroke-width="1.2" />
      <line x1="82" y1="126" x2="82" y2="142" stroke="#38BDF8" stroke-opacity="0.7" stroke-width="1.2" />

      <!-- Connector from API/AI to Semantic Embedding Space -->
      <path d="M 144 110 C 166 110, 168 114, 186 114" fill="none" stroke="#475569" stroke-width="1.2" stroke-dasharray="3 3" />
      <path d="M 144 158 C 168 158, 174 134, 218 118" fill="none" stroke="#38BDF8" stroke-opacity="0.6" stroke-width="1.2" />

      <!-- Semantic Vector Constellation -->
      <circle cx="222" cy="114" r="48" fill="none" stroke="#1E293B" stroke-width="1" />
      <circle cx="222" cy="114" r="28" fill="none" stroke="#1E293B" stroke-width="1" stroke-dasharray="2 3" />

      <!-- Vector Axes -->
      <line x1="170" y1="114" x2="274" y2="114" stroke="#1E293B" stroke-width="0.9" />
      <line x1="222" y1="62" x2="222" y2="166" stroke="#1E293B" stroke-width="0.9" />

      <!-- Semantic Constellation Edges -->
      <line x1="196" y1="92" x2="222" y2="114" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <line x1="252" y1="88" x2="222" y2="114" stroke="#38BDF8" stroke-opacity="0.55" stroke-width="1" />
      <line x1="254" y1="138" x2="222" y2="114" stroke="#38BDF8" stroke-opacity="0.45" stroke-width="1" />
      <line x1="198" y1="142" x2="222" y2="114" stroke="#38BDF8" stroke-opacity="0.35" stroke-width="1" />
      <line x1="196" y1="92" x2="252" y2="88" stroke="#334155" stroke-width="0.8" />

      <!-- Vector Nodes -->
      <circle cx="196" cy="92" r="3.5" fill="#0F172A" stroke="#38BDF8" stroke-width="1.5" />
      <circle cx="252" cy="88" r="4" fill="#38BDF8" fill-opacity="0.85" />
      <circle cx="254" cy="138" r="3" fill="#0F172A" stroke="#94A3B8" stroke-width="1.5" />
      <circle cx="198" cy="142" r="2.8" fill="#0F172A" stroke="#64748B" stroke-width="1.5" />
      <circle cx="222" cy="114" r="5" fill="#38BDF8" />
      <circle cx="222" cy="114" r="9" fill="#38BDF8" fill-opacity="0.18" />
    </g>
  </g>

  <!-- Crisp Outer Border -->
  <rect x="0.5" y="0.5" width="959" height="269" rx="13.5" fill="none" stroke="#1E293B" stroke-width="1" />
</svg>
